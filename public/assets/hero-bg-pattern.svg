<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="none" fill="none">
  <defs>
    <!-- Background Gradient Base -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#091124" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-indigo" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <!-- Soft Ambient Wave Gradients (Haikei style) -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04" />
    </linearGradient>

    <!-- Filter for Blur -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Deep Base -->
  <rect width="1440" height="900" fill="url(#bg-base)" />

  <!-- Ambient Light Orbs with Blur -->
  <g filter="url(#soft-blur)">
    <circle cx="280" cy="240" r="320" fill="url(#glow-cyan)" />
    <circle cx="1160" cy="380" r="380" fill="url(#glow-emerald)" />
    <circle cx="720" cy="750" r="350" fill="url(#glow-indigo)" />
  </g>

  <!-- Haikei Layered Fluid Wave Geometry -->
  <path d="M0,320 C320,400 480,240 800,310 C1120,380 1280,260 1440,300 L1440,900 L0,900 Z" fill="url(#wave-grad-1)" />
  <path d="M0,520 C260,460 520,620 880,510 C1240,400 1360,560 1440,540 L1440,900 L0,900 Z" fill="url(#wave-grad-2)" />

  <!-- Subtle Precision Tech Grid Overlay -->
  <rect width="1440" height="900" fill="url(#tech-grid)" opacity="0.8" />
</svg>
